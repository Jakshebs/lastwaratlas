<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warzone Atlas</title>
<style>
:root{--bg:#080b12;--panel:#101622;--panel2:#151d2b;--line:#263247;--text:#edf2f7;--muted:#8e9bb0;--accent:#55c7ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#172438 0,#080b12 42%);color:var(--text);font-family:Inter,system-ui,Arial}
header{padding:28px 18px 20px;max-width:1100px;margin:auto}
.brand{font-size:28px;font-weight:800}.sub{color:var(--muted);margin-top:5px}
main{max-width:1100px;margin:auto;padding:0 18px 40px}
.search{display:flex;gap:10px}.search input{flex:1;background:var(--panel);border:1px solid var(--line);color:white;padding:15px 16px;border-radius:12px;font-size:16px}.search button{background:var(--accent);border:0;border-radius:12px;padding:0 22px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:15px;padding:17px}.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.value{font-size:25px;font-weight:800;margin-top:5px}
#results{margin-top:18px;display:grid;gap:10px}.result{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;justify-content:space-between;gap:10px}.type{color:var(--accent);font-size:12px;font-weight:700}.name{font-weight:750;margin-top:4px}.meta{color:var(--muted);font-size:13px;margin-top:5px}
.map{height:330px;margin-top:18px;border:1px solid var(--line);border-radius:15px;overflow:hidden;background-color:#0b111b;background-image:linear-gradient(#182437 1px,transparent 1px),linear-gradient(90deg,#182437 1px,transparent 1px);background-size:32px 32px;position:relative}.map:after{content:"WORLD MAP";position:absolute;inset:0;display:grid;place-items:center;color:#33445e;font-weight:900;letter-spacing:.2em}
@media(max-width:700px){.grid{grid-template-columns:1fr}.search button{padding:0 15px}.result{display:block}}
</style>
</head>
<body>
<header><div class="brand">⚔ Warzone Atlas</div><div class="sub">Last War intelligence • read-only public data</div></header>
<main>
<div class="search"><input id="q" placeholder="Search commander or alliance…" autocomplete="off"><button onclick="search()">SEARCH</button></div>
<div class="grid"><div class="card"><div class="label">Status</div><div class="value" id="status">Ready</div></div><div class="card"><div class="label">Results</div><div class="value" id="count">0</div></div><div class="card"><div class="label">Mode</div><div class="value">Public</div></div></div>
<section id="results"></section>
<div class="map"></div>
</main>
<script>
const q=document.getElementById('q'), results=document.getElementById('results');
q.addEventListener('keydown',e=>{if(e.key==='Enter')search()});
async function search(){
 const term=q.value.trim(); if(!term)return;
 document.getElementById('status').textContent='Searching…';
 try{
   const r=await fetch('/api/search?q='+encodeURIComponent(term));
   const d=await r.json();
   if(d.error)throw new Error(d.error);
   const items=d.items||[];
   document.getElementById('count').textContent=items.length;
   document.getElementById('status').textContent='Online';
   results.innerHTML=items.map(x=>`
     <div class="result">
       <div><div class="type">${x.kind||x.type||'RESULT'}</div>
       <div class="name">${escapeHtml(x.name||'Unknown')}</div>
       <div class="meta">Warzone ${x.serverId??'—'} ${x.tag?'• '+escapeHtml(x.tag):''}</div></div>
       <div class="meta">${x.power!=null?'Power '+Number(x.power).toLocaleString():''}</div>
     </div>`).join('') || '<div class="card">No matches found.</div>';
 }catch(e){document.getElementById('status').textContent='Error';results.innerHTML='<div class="card">Could not reach the public data service.</div>'}
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
</script>
</body>
</html>
